name: daily

on:
  schedule:
    - cron: "17 */4 * * *" # every 4 hours; GitHub delays top-of-hour schedules (hours under load)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dataset
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      # A run is named by the KST date and hour it starts at (schedules often
      # start hours late). An hour already published (e.g. a manual run earlier
      # that hour; a day or coarser file counts as its whole last day) ends the
      # job as a success; the remaining steps are skipped.
      - name: Check date
        id: day
        run: |
          read -r today hour < <(TZ=Asia/Seoul date '+%F %H')
          echo "today=$today" >> "$GITHUB_OUTPUT"
          echo "hour=$hour" >> "$GITHUB_OUTPUT"
          last=$(jq -r '.parts[-1] | .last + "T" + ((.path | capture("-h(?<h>[0-9]{2})\\.db$").h) // "23")' manifest.json 2>/dev/null || true)
          if [[ ! "${today}T$hour" > "$last" ]]; then
            echo "${today}T$hour already published (last: $last); skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.day.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.day.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.day.outputs.skip != 'true'
        run: cargo build --release --locked

      - name: Download state
        if: steps.day.outputs.skip != 'true'
        run: |
          gh release download state --pattern 'state.db*' --dir work
          if [ -f work/state.db.zst ]; then zstd -d -f --rm work/state.db.zst -o work/state.db; fi

      - name: Update
        if: steps.day.outputs.skip != 'true'
        run: ./target/release/hitomi-dataset daily --state work/state.db --repo . --date "${{ steps.day.outputs.today }}" --hour "${{ steps.day.outputs.hour }}"

      # Parts first: if the state upload below fails, the next run replays the
      # pushed parts onto the old state before doing its own work.
      - name: Commit parts
        if: steps.day.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data manifest.json
          git diff --cached --quiet || git commit -m "data: ${{ steps.day.outputs.today }}T${{ steps.day.outputs.hour }}"
          git push

      - name: Upload state
        if: steps.day.outputs.skip != 'true'
        run: |
          zstd -T0 -10 --rm work/state.db -o work/state.db.zst
          gh release upload state work/state.db.zst --clobber
          gh release delete-asset state state.db --yes || true
